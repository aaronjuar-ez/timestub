[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "timestub"
version = "0.1.0"
description = "a terminal shift-pay calculator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["textual>=8.2"]

[project.scripts]
timestub = "tui:main"

[tool.setuptools]
py-modules = ["tui"]
